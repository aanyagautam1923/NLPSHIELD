        <div>
            <span class="result-label">Analysis Result</span>
            <h3 id="resultTitle">Security Analysis</h3>
        </div>

        <span class="risk-badge" id="riskBadge">
            LOW
        </span>
    </div>

    <div class="result-grid">
        <div class="result-item">
            <span>Threat</span>
            <strong id="resultThreat">-</strong>
        </div>

        <div class="result-item">
            <span>Threat Category</span>
            <strong id="resultCategory">-</strong>
        </div>

        <div class="result-item">
            <span>Toxicity</span>
            <strong id="resultToxicity">-</strong>
        </div>

        <div class="result-item">
            <span>Confidence</span>
            <strong id="resultConfidence">-</strong>
        </div>
    </div>

    <div class="result-explanation">
        <h4>Explanation</h4>
        <p id="resultExplanation">
            Analysis explanation will appear here.
        </p>
    </div>
</div>
